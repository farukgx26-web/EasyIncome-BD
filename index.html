<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyIncome BD</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5ff;
      color: #172554;
      text-align: center;
    }
    header {
      background: #1647d5;
      color: white;
      padding: 25px 12px;
    }
    header h1 {
      margin: 0;
      font-size: 30px;
    }
    main {
      padding: 25px 16px;
    }
    .card {
      background: white;
      padding: 24px 16px;
      margin: 18px auto;
      border-radius: 16px;
      max-width: 420px;
      box-shadow: 0 4px 14px #00000012;
    }
    .btn {
      display: inline-block;
      background: #1647d5;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
    }
    footer {
      padding: 20px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>EasyIncome BD</h1>
    <p>Learn Skills. Discover Tasks. Grow Together.</p>
  </header>

  <main>
    <div class="card">
      <h2>Welcome to EasyIncome BD!</h2>
      <p>Explore online tasks and develop useful skills.</p>
      <a class="btn" href="#tasks">Explore Tasks</a>
    </div>

    <div class="card" id="tasks">
      <h2>Available Tasks</h2>
      <p>Our task section is coming soon.</p>
    </div>
  </main>

  <footer>
    © 2026 EasyIncome BD
  </footer>
</body>
</html>
